name: SOP preview regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install server preview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk fontconfig

      - name: Install Python dependencies
        run: python -m pip install -e .

      - name: Verify required preview artifacts
        run: |
          test -f scripts/render_pdf_pages.py
          test -f scripts/render_docx_preview.ps1
          test -f scripts/generate_sop_template_ai_handoff.py

      - name: Run preview reliability tests
        run: |
          python -m unittest \
            tests.test_sop_conversational_docx.SopConversationalDocxTests.test_pdf_page_renderer_supports_chinese_paths \
            tests.test_sop_conversational_docx.SopConversationalDocxTests.test_preview_publish_uses_versioned_directory_when_current_preview_is_locked \
            tests.test_sop_conversational_docx.SopConversationalDocxTests.test_linux_preview_conversion_uses_libreoffice_backend \
            tests.test_sop_conversational_docx.SopConversationalDocxTests.test_document_runtime_status_reports_server_converter \
            tests.test_sop_conversational_docx.SopConversationalDocxTests.test_real_libreoffice_backend_converts_docx_when_available \
            -v

      - name: Run complete SOP regression suite
        run: python -m unittest discover -s tests -p "test_sop_*.py" -v
